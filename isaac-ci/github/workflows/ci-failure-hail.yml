name: CI Failure Hail

on:
  workflow_run:
    workflows:
      - CI Tests
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  hail-on-regression:
    if: >
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    env:
      ISAAC_HAIL_URL: ${{ secrets.ISAAC_HAIL_URL }}
      ISAAC_SERVER_AUTH_TOKEN: ${{ secrets.ISAAC_SERVER_AUTH_TOKEN }}
    steps:
      - name: Decide whether this is a green -> red transition
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const {owner, repo} = context.repo;
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: run.workflow_id,
              branch: run.head_branch,
              status: 'completed',
              per_page: 10
            });

            const previous = data.workflow_runs.find(r =>
              r.id !== run.id &&
              r.event === 'push' &&
              r.head_branch === run.head_branch
            );

            const shouldHail = previous && previous.conclusion === 'success';
            core.setOutput('should_hail', shouldHail ? 'true' : 'false');
            core.setOutput('previous_conclusion', previous ? previous.conclusion : '');

      - name: Stop when the branch was already red
        if: steps.gate.outputs.should_hail != 'true'
        run: |
          echo "No hail sent."
          echo "Previous main push conclusion: '${{ steps.gate.outputs.previous_conclusion }}'"

      - name: Read commit subject and optional Isaac session trailer
        id: commit
        if: steps.gate.outputs.should_hail == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const sha = context.payload.workflow_run.head_sha;
            const {data} = await github.rest.repos.getCommit({owner, repo, ref: sha});
            const message = data.commit.message || '';
            const subject = message.split('\n')[0] || '';
            const match = message.match(/^Isaac-Session:\s*(\S+)/mi);
            core.setOutput('subject', subject);
            core.setOutput('session_id', match ? match[1] : '');

      - name: Send hail to Isaac
        if: steps.gate.outputs.should_hail == 'true'
        shell: bash
        run: |
          set -euo pipefail

          payload="$(
            jq -n \
              --arg repo "${{ github.event.repository.name }}" \
              --arg full_repo "${{ github.repository }}" \
              --arg workflow "${{ github.event.workflow_run.name }}" \
              --arg run_url "${{ github.event.workflow_run.html_url }}" \
              --arg sha "${{ github.event.workflow_run.head_sha }}" \
              --arg branch "${{ github.event.workflow_run.head_branch }}" \
              --arg actor "${{ github.event.workflow_run.actor.login }}" \
              --arg commit_subject "${{ steps.commit.outputs.subject }}" \
              --arg session_id "${{ steps.commit.outputs.session_id }}" \
              '
              {
                frequencies: {band: "ci-failure"},
                params:
                  ({
                    repo: $repo,
                    full_repo: $full_repo,
                    workflow: $workflow,
                    run_url: $run_url,
                    sha: $sha,
                    branch: $branch,
                    actor: $actor,
                    commit_subject: $commit_subject
                  } + (if $session_id != "" then {session_id: $session_id} else {} end))
              }'
          )"

          curl --fail-with-body \
            -X POST "$ISAAC_HAIL_URL" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $ISAAC_SERVER_AUTH_TOKEN" \
            -d "$payload"
