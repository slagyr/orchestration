name: CI Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skirmish-specs:
    name: Skirmish specs
    runs-on: ubuntu-latest
    env:
      NO_COLOR: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Clojure and Babashka
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          bb: latest
          cli: latest

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            skirmish/.cpcache
          key: ${{ runner.os }}-orchestration-skirmish-${{ hashFiles('skirmish/deps.edn', 'skirmish/bb.edn') }}
          restore-keys: |
            ${{ runner.os }}-orchestration-skirmish-

      - name: Run skirmish specs
        working-directory: skirmish
        run: bb spec
