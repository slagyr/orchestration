name: CI Failure Hail Reusable

on:
  workflow_call:
    inputs:
      repository_owner:
        required: true
        type: string
      repository_name:
        required: true
        type: string
      repository_full_name:
        required: true
        type: string
      workflow_id:
        required: true
        type: string
      workflow_name:
        required: true
        type: string
      workflow_run_id:
        required: true
        type: string
      workflow_run_url:
        required: true
        type: string
      workflow_conclusion:
        required: true
        type: string
      workflow_event:
        required: true
        type: string
      workflow_head_branch:
        required: true
        type: string
      workflow_head_sha:
        required: true
        type: string
      workflow_actor:
        required: true
        type: string
      hail_band:
        required: false
        type: string
        default: ci-failure
    secrets:
      ISAAC_HAIL_URL:
        required: true
      ISAAC_SERVER_AUTH_TOKEN:
        required: true

jobs:
  hail-on-regression:
    if: >
      inputs.workflow_event == 'push' &&
      inputs.workflow_head_branch == 'main' &&
      inputs.workflow_conclusion == 'failure'
    runs-on: ubuntu-latest
    env:
      ISAAC_HAIL_URL: ${{ secrets.ISAAC_HAIL_URL }}
      ISAAC_SERVER_AUTH_TOKEN: ${{ secrets.ISAAC_SERVER_AUTH_TOKEN }}
    steps:
      - name: Decide whether this is a green -> red transition
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const owner = '${{ inputs.repository_owner }}';
            const repo = '${{ inputs.repository_name }}';
            const workflowId = '${{ inputs.workflow_id }}';
            const currentRunId = '${{ inputs.workflow_run_id }}';
            const branch = '${{ inputs.workflow_head_branch }}';

            const {data} = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowId,
              branch,
              status: 'completed',
              per_page: 10
            });

            const previous = data.workflow_runs.find(r =>
              String(r.id) !== currentRunId &&
              r.event === 'push' &&
              r.head_branch === branch
            );

            const shouldHail = previous && previous.conclusion === 'success';
            core.setOutput('should_hail', shouldHail ? 'true' : 'false');
            core.setOutput('previous_conclusion', previous ? previous.conclusion : '');

      - name: Stop when the branch was already red
        if: steps.gate.outputs.should_hail != 'true'
        run: |
          echo "No hail sent."
          echo "Previous main push conclusion: '${{ steps.gate.outputs.previous_conclusion }}'"

      - name: Send hail to Isaac
        if: steps.gate.outputs.should_hail == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = '${{ inputs.repository_owner }}';
            const repo = '${{ inputs.repository_name }}';
            const sha = '${{ inputs.workflow_head_sha }}';
            const runId = '${{ inputs.workflow_run_id }}';
            const band = '${{ inputs.hail_band }}';

            const {data: commit} = await github.rest.repos.getCommit({owner, repo, ref: sha});
            const message = commit.commit.message || '';
            const subject = message.split('\n')[0] || '';
            const sessionMatch = message.match(/^Isaac-Session:\s*(\S+)/mi);
            const beanMatch = message.match(/^Isaac-Bean:\s*(\S+)/mi);
            const sessionId = sessionMatch ? sessionMatch[1] : '';
            const beanId = beanMatch ? beanMatch[1] : '';

            const {data: jobsPage} = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: runId
            });

            const failedJobs = (jobsPage.jobs || []).filter(j => j.conclusion === 'failure');
            const failingJobs = failedJobs.map(j => j.name);
            const failingSteps = failedJobs.flatMap(j =>
              (j.steps || [])
                .filter(s => s.conclusion === 'failure')
                .map(s => `${j.name}: ${s.name}`)
            );

            const frequencies = {band};
            if (sessionId) {
              frequencies.session = [sessionId];
            }

            const params = {
              repo: '${{ inputs.repository_name }}',
              full_repo: '${{ inputs.repository_full_name }}',
              workflow: '${{ inputs.workflow_name }}',
              run_id: runId,
              run_url: '${{ inputs.workflow_run_url }}',
              sha,
              branch: '${{ inputs.workflow_head_branch }}',
              actor: '${{ inputs.workflow_actor }}',
              commit_subject: subject,
              failing_jobs: failingJobs.join(', '),
              failing_steps: failingSteps.join('; ')
            };
            if (beanId) {
              params.bean_id = beanId;
            }

            const payload = {frequencies, params};

            const response = await fetch(process.env.ISAAC_HAIL_URL, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.ISAAC_SERVER_AUTH_TOKEN}`
              },
              body: JSON.stringify(payload)
            });

            const body = await response.text();
            if (!response.ok) {
              core.setFailed(`Isaac hail failed (${response.status}): ${body}`);
              return;
            }
            core.info(`Isaac hail sent: ${body}`);