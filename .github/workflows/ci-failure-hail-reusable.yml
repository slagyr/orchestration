name: CI Failure Hail Reusable

on:
  workflow_call:
    inputs:
      repository_owner:
        required: true
        type: string
      repository_name:
        required: true
        type: string
      repository_full_name:
        required: true
        type: string
      workflow_id:
        required: true
        type: string
      workflow_name:
        required: true
        type: string
      workflow_run_id:
        required: true
        type: string
      workflow_run_url:
        required: true
        type: string
      workflow_conclusion:
        required: true
        type: string
      workflow_event:
        required: true
        type: string
      workflow_head_branch:
        required: true
        type: string
      workflow_head_sha:
        required: true
        type: string
      workflow_actor:
        required: true
        type: string
      hail_band:
        required: false
        type: string
        default: ci-failure
    secrets:
      ISAAC_HAIL_URL:
        required: true
      ISAAC_SERVER_AUTH_TOKEN:
        required: true

jobs:
  hail-on-regression:
    if: >
      inputs.workflow_event == 'push' &&
      inputs.workflow_head_branch == 'main' &&
      inputs.workflow_conclusion == 'failure'
    runs-on: ubuntu-latest
    env:
      ISAAC_HAIL_URL: ${{ secrets.ISAAC_HAIL_URL }}
      ISAAC_SERVER_AUTH_TOKEN: ${{ secrets.ISAAC_SERVER_AUTH_TOKEN }}
    steps:
      - name: Decide whether this is a green -> red transition
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const owner = '${{ inputs.repository_owner }}';
            const repo = '${{ inputs.repository_name }}';
            const workflowId = '${{ inputs.workflow_id }}';
            const currentRunId = '${{ inputs.workflow_run_id }}';
            const branch = '${{ inputs.workflow_head_branch }}';

            const {data} = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowId,
              branch,
              status: 'completed',
              per_page: 10
            });

            const previous = data.workflow_runs.find(r =>
              String(r.id) !== currentRunId &&
              r.event === 'push' &&
              r.head_branch === branch
            );

            const shouldHail = previous && previous.conclusion === 'success';
            core.setOutput('should_hail', shouldHail ? 'true' : 'false');
            core.setOutput('previous_conclusion', previous ? previous.conclusion : '');

      - name: Stop when the branch was already red
        if: steps.gate.outputs.should_hail != 'true'
        run: |
          echo "No hail sent."
          echo "Previous main push conclusion: '${{ steps.gate.outputs.previous_conclusion }}'"

      - name: Read commit subject and optional Isaac session trailer
        id: commit
        if: steps.gate.outputs.should_hail == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = '${{ inputs.repository_owner }}';
            const repo = '${{ inputs.repository_name }}';
            const sha = '${{ inputs.workflow_head_sha }}';
            const {data} = await github.rest.repos.getCommit({owner, repo, ref: sha});
            const message = data.commit.message || '';
            const subject = message.split('\n')[0] || '';
            const match = message.match(/^Isaac-Session:\s*(\S+)/mi);
            core.setOutput('subject', subject);
            core.setOutput('session_id', match ? match[1] : '');

      - name: Send hail to Isaac
        if: steps.gate.outputs.should_hail == 'true'
        shell: bash
        run: |
          set -euo pipefail

          payload="$(
            jq -n \
              --arg repo "${{ inputs.repository_name }}" \
              --arg full_repo "${{ inputs.repository_full_name }}" \
              --arg workflow "${{ inputs.workflow_name }}" \
              --arg run_url "${{ inputs.workflow_run_url }}" \
              --arg sha "${{ inputs.workflow_head_sha }}" \
              --arg branch "${{ inputs.workflow_head_branch }}" \
              --arg actor "${{ inputs.workflow_actor }}" \
              --arg commit_subject "${{ steps.commit.outputs.subject }}" \
              --arg session_id "${{ steps.commit.outputs.session_id }}" \
              --arg band "${{ inputs.hail_band }}" \
              '
              {
                frequencies: {band: $band},
                params:
                  ({
                    repo: $repo,
                    full_repo: $full_repo,
                    workflow: $workflow,
                    run_url: $run_url,
                    sha: $sha,
                    branch: $branch,
                    actor: $actor,
                    commit_subject: $commit_subject
                  } + (if $session_id != "" then {session_id: $session_id} else {} end))
              }'
          )"

          curl --fail-with-body \
            -X POST "$ISAAC_HAIL_URL" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $ISAAC_SERVER_AUTH_TOKEN" \
            -d "$payload"
